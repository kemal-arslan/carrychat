[package]
name = "carrychat-node"
description = "Message store, forwarding and links of a CarryChat node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arti-client = { version = "0.34", default-features = false, features = ["tokio", "native-tls", "compression"] }
btleplug = { version = "0.11", optional = true }
aes = "0.8"
data-encoding = "2"
ed25519-dalek = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hkdf = "0.12"
hmac = "0.12"
if-addrs = "0.15"
k256 = { version = "0.13", features = ["schnorr"] }
carrychat-proto = { path = "../carrychat-proto" }
prost = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
tor-rtcompat = { version = "0.34", default-features = false, features = ["tokio", "native-tls"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

uuid = { version = "1", optional = true }

[features]
# Bluetooth LE (§9.5) through the operating system's stack, where btleplug
# supports it. Android has its own, in the app.
bluetooth = ["dep:btleplug", "dep:uuid"]
# The data key in the operating system's key store (§10): macOS Keychain,
# Windows Credential Manager or the Secret Service on Linux. Android has its
# own, in the app.
keychain = ["dep:keyring"]

[dev-dependencies]
prost = "0.13"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tempfile = "3"

# USB serial for LoRa devices, without libudev, which only lists ports.
[target.'cfg(not(target_os = "android"))'.dependencies]
serialport = { version = "4", default-features = false }

# Android has no system OpenSSL for native-tls (relays, Tor): build it in.
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

# The database is SQLCipher (§10). It encrypts with CommonCrypto on Apple's
# systems and with OpenSSL elsewhere: the system's on Linux, built in on
# Android and Windows, which have none to link.
[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }

[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }

[target.'cfg(not(any(target_vendor = "apple", target_os = "linux")))'.dependencies]
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }

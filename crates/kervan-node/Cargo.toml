[package]
name = "kervan-node"
description = "Message store, forwarding and links of a Kervan node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arti-client = { version = "0.34", default-features = false, features = ["tokio", "native-tls", "compression"] }
data-encoding = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hmac = "0.12"
if-addrs = "0.15"
k256 = { version = "0.13", features = ["schnorr"] }
kervan-proto = { path = "../kervan-proto" }
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
tor-rtcompat = { version = "0.34", default-features = false, features = ["tokio", "native-tls"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tempfile = "3"

[package]
name = "carrychat-app"
description = "CarryChat app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "carrychat_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Tauri 2.12 needs Rust 1.90. The workspace targets 1.85, so Cargo picks 2.11:
# keep the @tauri-apps packages in package.json on the same minor versions.
[dependencies]
data-encoding = "2"
carrychat-node = { path = "../../crates/carrychat-node" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"

# Desktops connect to phones over Bluetooth through btleplug; Android has its
# own Bluetooth code in the app.
[target.'cfg(not(target_os = "android"))'.dependencies]
carrychat-node = { path = "../../crates/carrychat-node", features = ["bluetooth"] }

# Android: posting notifications through the service while no screen is open,
# and moving the bytes of Bluetooth connections, which Kotlin makes.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
tokio = { version = "1", features = ["io-util", "rt", "sync"] }
